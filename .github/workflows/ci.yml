name: CI

# 推送 / PR / 手动触发都跑; concurrency 保证同一分支只保留最新一次, 省 runner
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 pyproject.toml 的 [tool.uv] cache-dir 对齐, 缓存和 uv 看到的是同一个目录
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-local-path: .uv-cache
      # --locked: 只用 uv.lock 里锁定的版本, 不顺手改锁文件
      - run: uv run --locked ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-local-path: .uv-cache
      # pyproject 的 addopts 带了 --doctest-modules, 所以 docstring 示例也一起跑
      - run: uv run --locked --python ${{ matrix.python-version }} pytest -q
